<style>
:root{--bg:#f3f0ea;--ink:#1c1a17;--muted:#7a746b;--line:#dcd6cc;--dot:#e0402f;--card:#fbf9f5;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.hero{max-width:1240px;margin:0 auto;padding:72px 48px 0}
.hero h1{font:500 clamp(52px,8vw,112px)/.92 var(--serif);letter-spacing:-.02em}
.hero h1 i{width:.15em;height:.15em;border-radius:50%;background:var(--dot);display:inline-block;margin-left:.06em}
section{max-width:1240px;margin:0 auto;padding:72px 48px 0}
h2{font:500 clamp(28px,3.4vw,40px)/1.1 var(--serif);margin-bottom:24px}
.grid{columns:3 280px;column-gap:20px}
.grid a{display:block;break-inside:avoid;margin-bottom:24px;color:var(--muted);text-decoration:none;font-size:12.5px}
.grid img{display:block;width:100%;height:auto;background:var(--card);margin-bottom:8px}
footer{max-width:1240px;margin:120px auto 0;padding:32px 48px 48px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media (max-width:900px){.hero{padding:44px 16px 0}section{padding:56px 16px 0}.grid{columns:2;column-gap:12px}footer{padding:28px 16px 40px;margin-top:80px}}
</style>
